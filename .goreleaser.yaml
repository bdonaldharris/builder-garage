# GoReleaser configuration for garage release archives (#121), Linux packages
# (#123), and the Homebrew cask (#124).
#
# GoReleaser builds, archives, packages, checksums, and generates the cask. In
# release mode it also signs and notarizes the macOS executables (notarize,
# below), before archiving. It never signs the checksum manifest, attests, or
# publishes: those are separate least-privilege jobs in
# .github/workflows/release.yml (docs/adr/0003-release-distribution.md).
#
# The build matches "make build", plus -s -w for distributed binaries:
# CGO_ENABLED=0, -trimpath, and the tag as main.version. GoReleaser's default
# {{ .Version }} drops the leading "v", so the tag is set explicitly.
#
# Validate locally (GARAGE_RELEASE_MODE is required by the platform-signing
# hook; "snapshot" builds unsigned binaries and needs no credentials):
#   goreleaser check
#   GARAGE_RELEASE_MODE=snapshot goreleaser release --snapshot --clean --skip=publish
version: 2

project_name: garage

# Two builds with one definition (the YAML anchor): Linux, and the other
# platforms. A channel can select only the platforms it may serve; the
# Homebrew cask uses the Linux and macOS archives without changing asset names.
builds:
  - &build
    id: garage-linux
    main: ./cmd/garage
    binary: garage
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        # Platform signing happens after each build and before archiving, so
        # the checksums, signature, and attestations cover signed binaries.
        # The hook refuses a darwin release build without every macOS signing
        # credential; notarize.macos (below) then signs and notarizes the
        # darwin binaries. Windows binaries are not signed yet (#122).
        - cmd: sh .github/scripts/platform-sign.sh '{{ envOrDefault "GARAGE_RELEASE_MODE" "unset" }}' '{{ .Os }}' '{{ .Path }}'
          output: true
  - <<: *build
    id: garage-other
    goos: [darwin, windows]

archives:
  - id: garage-linux
    ids: [garage-linux]
    formats: [tar.gz]
    name_template: "garage_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
  - id: garage-other
    ids: [garage-other]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "garage_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Linux packages (#123). Each installs only /usr/bin/garage and its license
# file. There are no maintainer scripts, configuration files, or
# dependencies, so installing, upgrading, or removing a package never touches
# project configuration, installed skills, manuals, or local history. The
# file names are fixed by release inventory v2
# (.github/scripts/release-inventory.sh); the signed checksum manifest and the
# attestations cover them. The packages carry no PGP signature.
nfpms:
  - id: garage-deb
    ids: [garage-linux]
    package_name: garage
    formats: [deb]
    file_name_template: "garage_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Builder Garage
    homepage: https://github.com/bdonaldharris/builder-garage
    maintainer: Builder Garage maintainers <https://github.com/bdonaldharris/builder-garage>
    description: Builder Garage command-line interface.
    license: MIT
    contents:
      - src: LICENSE
        dst: /usr/share/doc/garage/copyright
  - id: garage-rpm
    ids: [garage-linux]
    package_name: garage
    formats: [rpm]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Builder Garage
    homepage: https://github.com/bdonaldharris/builder-garage
    maintainer: Builder Garage maintainers <https://github.com/bdonaldharris/builder-garage>
    description: Builder Garage command-line interface.
    license: MIT
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/garage/LICENSE
        type: license

# Homebrew cask (#124), for macOS and Linux. GoReleaser writes it to
# dist/homebrew/Casks/garage.rb and never publishes it: the release
# workflow's channel-publish job commits it to bdonaldharris/homebrew-tap,
# after the release is published and verified. The URL template is needed
# because GoReleaser's own release is disabled.
homebrew_casks:
  - name: garage
    ids: [garage-linux, garage-other]
    url:
      # v{{ .Version }} is the release tag (the guard accepts only vX.Y.Z tags),
      # and in a snapshot it follows the snapshot version.
      template: "https://github.com/bdonaldharris/builder-garage/releases/download/v{{ .Version }}/{{ .ArtifactName }}"
    binaries: [garage]
    homepage: https://github.com/bdonaldharris/builder-garage
    description: Builder Garage command-line interface.
    license: MIT
    skip_upload: true
    directory: Casks
    repository:
      owner: bdonaldharris
      name: homebrew-tap

# macOS signing and notarization (#122), in release mode only. GoReleaser's
# quill fork signs each darwin binary of garage-other with the Developer ID
# Application identity, with the hardened runtime and Apple's timestamp
# server, then submits it to Apple's notary service and waits for the
# verdict. It runs after the build hooks and before archiving.
#
# The credentials are base64 values from the macos-signing environment,
# passed through the process environment and never written to the checkout.
# GoReleaser signs without notarizing when a notary value is empty, and only
# logs a notarization that times out, so the release fails closed elsewhere:
# check-macos-signing-env.sh refuses missing credentials, and the release
# workflow's run-check job requires Gatekeeper's "Notarized Developer ID"
# verdict (check-macos-notarization.sh) before anything is signed.
notarize:
  macos:
    - ids: [garage-other]
      enabled: '{{ eq (envOrDefault "GARAGE_RELEASE_MODE" "unset") "release" }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        # Apple rejects longer-lived tokens, so 20m is GoReleaser's maximum.
        timeout: 20m

checksum:
  name_template: "garage_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Snapshots take the next minor version, so a snapshot selects the current
# release inventory. GARAGE_SNAPSHOT_BASE overrides the base, for example to
# build an older package for an upgrade test.
snapshot:
  version_template: "{{ envOrDefault \"GARAGE_SNAPSHOT_BASE\" (incminor .Version) }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true

# Publication is a separate job with an explicit asset list.
release:
  disable: true
