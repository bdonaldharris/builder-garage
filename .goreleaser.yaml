# GoReleaser configuration for garage release archives (#121) and Linux
# packages (#123).
#
# GoReleaser builds, archives, packages, and checksums. It never signs or
# publishes:
# signing, attestation, and publication are separate least-privilege jobs in
# .github/workflows/release.yml (docs/adr/0003-release-distribution.md).
#
# The build matches "make build", plus -s -w for distributed binaries:
# CGO_ENABLED=0, -trimpath, and the tag as main.version. GoReleaser's default
# {{ .Version }} drops the leading "v", so the tag is set explicitly.
#
# Validate locally (GARAGE_RELEASE_MODE is required by the platform-signing
# hook; "snapshot" leaves binaries unchanged):
#   goreleaser check
#   GARAGE_RELEASE_MODE=snapshot goreleaser release --snapshot --clean --skip=publish
version: 2

project_name: garage

builds:
  - id: garage
    main: ./cmd/garage
    binary: garage
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        # Platform signing happens here, after each build and before archiving,
        # so the checksums, signature, and attestations cover signed binaries.
        # Nothing is platform-signed yet; #122 fills the hook.
        - cmd: sh .github/scripts/platform-sign.sh '{{ envOrDefault "GARAGE_RELEASE_MODE" "unset" }}' '{{ .Os }}' '{{ .Path }}'
          output: true

archives:
  - id: garage
    ids: [garage]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "garage_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Linux packages (#123). Each installs only /usr/bin/garage and its license
# file. There are no maintainer scripts, configuration files, or
# dependencies, so installing, upgrading, or removing a package never touches
# project configuration, installed skills, manuals, or local history. The
# file names are fixed by release inventory v2
# (.github/scripts/release-inventory.sh); the signed checksum manifest and the
# attestations cover them. The packages carry no PGP signature.
nfpms:
  - id: garage-deb
    ids: [garage]
    package_name: garage
    formats: [deb]
    file_name_template: "garage_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Builder Garage
    homepage: https://github.com/bdonaldharris/builder-garage
    maintainer: Builder Garage maintainers <https://github.com/bdonaldharris/builder-garage>
    description: Builder Garage command-line interface.
    license: MIT
    contents:
      - src: LICENSE
        dst: /usr/share/doc/garage/copyright
  - id: garage-rpm
    ids: [garage]
    package_name: garage
    formats: [rpm]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Builder Garage
    homepage: https://github.com/bdonaldharris/builder-garage
    maintainer: Builder Garage maintainers <https://github.com/bdonaldharris/builder-garage>
    description: Builder Garage command-line interface.
    license: MIT
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/garage/LICENSE
        type: license

checksum:
  name_template: "garage_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Snapshots take the next minor version, so a snapshot selects the current
# release inventory. GARAGE_SNAPSHOT_BASE overrides the base, for example to
# build an older package for an upgrade test.
snapshot:
  version_template: "{{ envOrDefault \"GARAGE_SNAPSHOT_BASE\" (incminor .Version) }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true

# Publication is a separate job with an explicit asset list.
release:
  disable: true
