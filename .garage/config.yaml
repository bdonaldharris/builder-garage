# Builder Garage project configuration, schema version 2.
# Generated by "garage init". Check it with "garage config validate".
#
# "project" holds this project's choices at the declared extension points:
#   https://github.com/bdonaldharris/builder-garage/blob/main/docs/extension-points.md
# "tooling" holds Garage tooling settings, which grant no workflow authority:
#   https://github.com/bdonaldharris/builder-garage/blob/main/docs/tooling-configuration.md
#
# Change values through the project's normal review process.
schema_version: 2
project:
  integration_branch: main
  automated_reviewer:
    name: codex
    request: optional input where available; the chatgpt-codex-connector GitHub integration reviews a pull request when it is opened
  small_corrections:
    enabled: true
    without_issue: true
  discovery:
    mode: implementer-judgment
  suggestions_backlog: '#24'
  authorities:
    workflow_owner:
      role: lead maintainer
    change_acceptor:
      role: maintainer
    product_intent_acceptor:
      role: Workflow Owner
    small_correction_classifier:
      role: maintainer
  guidance:
    manuals:
      - name: go
        version: "0.1"
tooling:
  skill_targets:
    - harness: claude-code
      scope: user
      path:
        override: $CLAUDE_CONFIG_DIR/skills
        default: ~/.claude/skills
      confirmed_version: 2.1.277
      confirmed_on: "2026-11-12"
    - harness: codex
      scope: user
      path:
        override: $CODEX_HOME/skills
        default: ~/.codex/skills
      confirmed_version: 0.137.0
      confirmed_on: "2026-11-12"
    - harness: copilot-cli
      scope: user
      path:
        override: $COPILOT_HOME/skills
        default: ~/.copilot/skills
      confirmed_version: 1.0.93-1
      confirmed_on: "2026-11-12"
