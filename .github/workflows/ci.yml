name: CI

# Pull-request validation for the garage CLI. This workflow only validates:
# it publishes nothing and uses no secrets.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, vet, build, cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: make fmt-check
      - name: Static analysis
        run: make vet
      - name: Build
        run: make build
      - name: Run the built executable
        run: |
          ./garage --help
          ./garage version
      - name: Validate Builder Garage's own configuration
        run: ./garage config validate
      - name: Cross-compile
        run: make cross

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  release-config:
    name: Release configuration (snapshot)
    # Builds the release archives as a snapshot, exactly as the release
    # workflow does, but publishes, signs, and attests nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Exercise the release workflow's refusals
        run: sh .github/scripts/test-release-scripts.sh
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          install-only: true
      - name: Check the GoReleaser configuration
        run: goreleaser check
      - name: Build a snapshot
        env:
          GARAGE_RELEASE_MODE: snapshot
        run: goreleaser release --snapshot --clean --skip=publish
      - name: Check the snapshot's archives, manifest, and executables
        run: |
          version=$(jq -r .version dist/metadata.json)
          sh .github/scripts/check-release-dist.sh dist "$version" "$version" "$(git rev-parse HEAD)"
          sh .github/scripts/check-release-archive.sh "dist/garage_${version}_linux_amd64.tar.gz" "$version" "$(git rev-parse HEAD)"

  install:
    name: Source installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Exercise install.sh
        run: sh .github/scripts/test-install.sh
      - name: Exercise version derivation
        run: sh .github/scripts/test-version.sh
