name: CI

# Pull-request validation for the garage CLI. This workflow only validates:
# it publishes nothing and uses no secrets.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, vet, build, cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: make fmt-check
      - name: Static analysis
        run: make vet
      - name: Build
        run: make build
      - name: Run the built executable
        run: |
          ./garage --help
          ./garage version
      - name: Validate Builder Garage's own configuration
        run: ./garage config validate
      - name: Cross-compile
        run: make cross

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  install:
    name: Source installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Exercise install.sh
        run: sh .github/scripts/test-install.sh
