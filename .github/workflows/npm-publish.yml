name: npm

# Publishes a published garage release to npm as @buildergarage/garage, a
# launcher plus one package per platform (#158;
# docs/adr/0003-release-distribution.md, "Package-manager channels").
#
# It runs after the Release workflow completes, whatever that run's result:
# a dry run publishes no GitHub release, and a channel failure fails the
# Release run without affecting the release. So the decision is made here,
# from the release itself: the tag must be a vMAJOR.MINOR.PATCH tag on main
# (release-guard.sh), its GitHub release must be published (not a draft or
# prerelease), and the release must verify (verify-release.sh). Otherwise
# nothing is published.
#
# A manual dispatch, from main, recovers a failed publication or backfills an
# existing release, with the same checks. Publishing is safe to repeat:
# versions already on npm are compared, not republished (npm-publish.sh).
#
# This is its own workflow file, never called from release.yml: npm trusted
# publishing identifies it by this filename, and its id-token permission must
# not be available to the release workflow, whose identity signs the checksum
# manifest. Both triggers run from main, so its OIDC identity is
# npm-publish.yml@refs/heads/main. Third-party actions are pinned by commit.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag to publish to npm, for example v0.4.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.1.4
  # npm trusted publishing needs npm 11.5.1 or later on Node 22.14.0 or later.
  NODE_VERSION: "24"

jobs:
  validate:
    name: Check the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
      commit: ${{ steps.guard.outputs.commit }}
    steps:
      # Full history, with every branch and tag, so the guard can check that
      # the tag's commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # After a Release run, a refused tag or a missing GitHub release (a dry
      # run, or a run that stopped before publishing) means there is nothing
      # to publish: the run ends without publishing, and is not a failure.
      # A manual dispatch fails instead, since a release was asked for.
      - name: Check the tag is a version tag on main
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = workflow_run ]; then tag=$RUN_TAG; else tag=$INPUT_TAG; fi
          if ! sh .github/scripts/release-guard.sh tag "$tag" release refs/remotes/origin/main >"$RUNNER_TEMP/guard.out"; then
            if [ "$EVENT" = workflow_run ]; then
              echo "::notice::the Release run's ref is not a version tag on main; nothing is published to npm."
              exit 0
            fi
            exit 1
          fi
          cat "$RUNNER_TEMP/guard.out" >>"$GITHUB_OUTPUT"
          tag=$(sed -n 's/^tag=//p' "$RUNNER_TEMP/guard.out")
          echo "commit=$(git rev-parse "refs/tags/$tag^{commit}")" >>"$GITHUB_OUTPUT"
      - name: Check the GitHub release is published
        id: release
        if: steps.guard.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          if ! state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"'); then
            if [ "$EVENT" = workflow_run ]; then
              echo "::notice::$TAG has no GitHub release, for example after a dry run; nothing is published to npm."
              exit 0
            fi
            echo "::error::$TAG has no GitHub release to publish."
            exit 1
          fi
          if [ "$state" != "false false" ]; then
            echo "::error::$TAG's GitHub release is a draft or a prerelease (isDraft isPrerelease: $state); nothing is published to npm."
            exit 1
          fi
          echo "publish=true" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.release.outputs.publish == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Download and verify the published release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          sh .github/scripts/verify-release.sh published "$TAG" "$GITHUB_REPOSITORY"
      - name: Keep the verified archives and manifest for publishing
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-archives
          path: |
            published/garage_*_checksums.txt
            published/garage_*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # No reviewers: the Workflow Owner approved the release itself. The
    # environment's deployment rule allows only main. It holds no secret,
    # except NPM_TOKEN for a first publish only (#158); trusted publishing
    # (OIDC) needs none.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-archives
          path: archives
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check the npm version supports trusted publishing
        run: |
          v=$(npm --version)
          if ! printf '11.5.1\n%s\n' "$v" | sort -C -V; then
            echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
      - name: Generate the packages from the verified archives
        run: sh .github/scripts/npm-packages.sh "$VERSION" archives "$RUNNER_TEMP/npm-packages"
      - name: Publish the platform packages, then the launcher
        env:
          # Only for a first publish, before trusted publishing is configured
          # (#158). npm reads the token from the environment; it is never
          # written to disk.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' >"$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          fi
          # A missing package (a first publish) has no latest. Any other
          # registry error stops the run, so latest is never moved by mistake.
          if latest=$(npm view @buildergarage/garage dist-tags.latest 2>"$RUNNER_TEMP/view.err"); then
            :
          elif grep -q E404 "$RUNNER_TEMP/view.err"; then
            latest=
          else
            cat "$RUNNER_TEMP/view.err"
            exit 1
          fi
          dist_tag=$(sh .github/scripts/npm-dist-tag.sh "$VERSION" "$latest")
          echo "Publishing $VERSION under the dist-tag $dist_tag (current latest: ${latest:-none})"
          sh .github/scripts/npm-publish.sh "$RUNNER_TEMP/npm-packages" "$dist_tag"

  verify:
    name: Install from npm (${{ matrix.runner }})
    needs: [validate, publish]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install, check, and remove garage from npm
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: sh .github/scripts/check-npm-install.sh --registry "$VERSION" "$TAG" "$COMMIT"
