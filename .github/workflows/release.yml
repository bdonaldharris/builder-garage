name: Release

# Builds, signs, attests, and publishes a garage release from a version tag
# (docs/adr/0003-release-distribution.md; #120, #121).
#
# It runs only when a maintainer dispatches it from an existing vMAJOR.MINOR.PATCH
# tag, and refuses any other ref before building anything. Two modes:
#   dry-run  build, archive, checksum, and validate at the tag. Nothing is
#            signed, attested, uploaded, or published.
#   release  also run every archive on its own platform, sign the checksum
#            manifest (keyless cosign), attest every archive, verify all of
#            it, and, after the Workflow Owner approves the protected release
#            environment, publish exactly those assets. Platform signing of
#            the macOS and Windows executables (#122) is required first: until
#            then, release mode fails closed.
#
# Each job holds only the permissions its step needs (#120 decision 6).
# Third-party actions are pinned by commit.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run builds and validates only; release signs, attests, and publishes after approval"
        type: choice
        options: [dry-run, release]
        default: dry-run

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.20.2
  COSIGN_VERSION: v3.1.4

jobs:
  guard:
    name: Refuse anything but a version tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the ref and mode
        id: guard
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MODE: ${{ inputs.mode }}
        run: sh .github/scripts/release-guard.sh "$REF_TYPE" "$REF_NAME" "$MODE" >>"$GITHUB_OUTPUT"

  build:
    name: Build, archive, checksum, validate
    needs: guard
    runs-on: ubuntu-latest
    # Holds the platform-signing credentials (#122). Its deployment rule
    # allows only v* tags.
    environment: release-signing
    permissions:
      contents: read
    env:
      GARAGE_RELEASE_MODE: ${{ inputs.mode }}
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a release without platform-signing credentials
        if: inputs.mode == 'release'
        # The names must match .github/scripts/check-signing-credentials.sh.
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          WINDOWS_SIGN_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERTIFICATE }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: sh .github/scripts/check-signing-credentials.sh
      - name: Check the checkout is the tagged commit
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Build, archive, and checksum
        env:
          GORELEASER_CURRENT_TAG: ${{ needs.guard.outputs.tag }}
        run: goreleaser release --clean --skip=publish
      - name: Check the archives, manifest, and executables
        run: sh .github/scripts/check-release-dist.sh dist "$VERSION" "$TAG" "$(git rev-parse HEAD)"
      - name: Run the linux/amd64 archive
        run: sh .github/scripts/check-release-archive.sh "dist/garage_${VERSION}_linux_amd64.tar.gz" "$TAG" "$(git rev-parse HEAD)"
      - name: Hand the archives and manifest to the next jobs
        if: inputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: |
            dist/garage_${{ env.VERSION }}_*.tar.gz
            dist/garage_${{ env.VERSION }}_*.zip
            dist/garage_${{ env.VERSION }}_checksums.txt
          if-no-files-found: error
          retention-days: 1

  run-check:
    name: Run ${{ matrix.target }}
    needs: [guard, build]
    if: inputs.mode == 'release'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux_amd64, ext: tar.gz, runner: ubuntu-latest }
          - { target: linux_arm64, ext: tar.gz, runner: ubuntu-24.04-arm }
          - { target: darwin_amd64, ext: tar.gz, runner: macos-15-intel }
          - { target: darwin_arm64, ext: tar.gz, runner: macos-latest }
          - { target: windows_amd64, ext: zip, runner: windows-latest }
          - { target: windows_arm64, ext: zip, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: assets
      - name: Run the archive
        shell: bash
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          ARCHIVE: assets/garage_${{ needs.guard.outputs.version }}_${{ matrix.target }}.${{ matrix.ext }}
        run: sh .github/scripts/check-release-archive.sh "$ARCHIVE" "$TAG" "$GITHUB_SHA"

  sign:
    name: Sign the checksum manifest
    needs: [guard, run-check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      MANIFEST: garage_${{ needs.guard.outputs.version }}_checksums.txt
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: assets
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign with keyless cosign
        run: cosign sign-blob --yes --bundle "assets/$MANIFEST.sigstore.json" "assets/$MANIFEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: assets/${{ env.MANIFEST }}.sigstore.json
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest every archive
    needs: [guard, run-check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: assets
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: assets/garage_${{ needs.guard.outputs.version }}_checksums.txt

  verify:
    name: Verify before publishing
    needs: [guard, sign, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify the signature, checksums, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: sh .github/scripts/verify-release.sh assets "$TAG" "$GITHUB_REPOSITORY"

  publish:
    name: Publish the release
    needs: [guard, verify]
    runs-on: ubuntu-latest
    # Requires the Workflow Owner's approval; its deployment rule allows only
    # v* tags.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Create a draft release with exactly the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" "$GITHUB_REPOSITORY" >notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "garage $TAG" --notes-file notes.md assets/*
      - name: Check the draft's assets, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want=$(ls -1 assets | sort)
          got=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          if [ "$got" != "$want" ]; then
            echo "::error::the draft's assets differ from the verified assets"
            printf 'want:\n%s\ngot:\n%s\n' "$want" "$got"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  post-verify:
    name: Verify the published release
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Download and verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          sh .github/scripts/verify-release.sh published "$TAG" "$GITHUB_REPOSITORY"
