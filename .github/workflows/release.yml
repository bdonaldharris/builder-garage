name: Release

# Builds, signs, attests, and publishes a garage release from a version tag
# (docs/adr/0003-release-distribution.md; #120, #121, #123).
#
# It runs only when a maintainer dispatches it from an existing vMAJOR.MINOR.PATCH
# tag whose commit is on main, and refuses any other ref, and any tag off main,
# before building anything (#138). The files a release
# publishes are its release inventory (.github/scripts/release-inventory.sh).
# Two modes:
#   dry-run  build, archive, package, checksum, and validate at the tag.
#            Nothing is signed, attested, or published.
#   release  also sign and notarize the macOS executables before archiving,
#            run every archive on its own platform (and check the macOS
#            ones' notarization), install, check, and remove every Linux
#            package with its own package manager, sign the checksum manifest
#            (keyless cosign), attest every listed file, verify all of it,
#            and, after the Workflow Owner approves the protected release
#            environment, publish exactly the inventory's files. The Windows
#            executables are not yet Authenticode-signed (#122, phase 2); the
#            release notes say so (amended #120 decision 4).
#
# Each job holds only the permissions its step needs (#120 decision 6).
# Third-party actions are pinned by commit.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run builds and validates only; release signs, attests, and publishes after approval"
        type: choice
        options: [dry-run, release]
        default: dry-run

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.20.2
  # The Apple Team ID of the Developer ID Application identity that signs the
  # macOS executables: "Developer ID Application: BRIAN DONALD HARRIS
  # (38397A2FG6)" (#122). run-check requires it.
  MACOS_TEAM_ID: 38397A2FG6
  COSIGN_VERSION: v3.1.4
  # Fedora 45, pinned by digest, for the rpm package checks.
  FEDORA_IMAGE: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c

jobs:
  guard:
    name: Refuse anything but a version tag on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      # Full history, with every branch and tag, so the guard can check that
      # the tag's commit is reachable from origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the ref, the mode, and that the tag is on main
        id: guard
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MODE: ${{ inputs.mode }}
        run: sh .github/scripts/release-guard.sh "$REF_TYPE" "$REF_NAME" "$MODE" origin/main >>"$GITHUB_OUTPUT"

  build:
    name: Build and archive
    needs: guard
    runs-on: ubuntu-latest
    # Holds only the five macOS signing and notarization secrets (#122). Its
    # deployment rule allows only v* tags, and it has no reviewers: the
    # Workflow Owner's approval stays at publish. The secrets reach only the
    # two steps that need them, and only in release mode.
    environment: macos-signing
    permissions:
      contents: read
    env:
      GARAGE_RELEASE_MODE: ${{ inputs.mode }}
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the checkout is the tagged commit
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Refuse a release without every macOS signing credential
        env:
          MACOS_SIGN_P12: ${{ inputs.mode == 'release' && secrets.MACOS_SIGN_P12 || '' }}
          MACOS_SIGN_PASSWORD: ${{ inputs.mode == 'release' && secrets.MACOS_SIGN_PASSWORD || '' }}
          MACOS_NOTARY_KEY: ${{ inputs.mode == 'release' && secrets.MACOS_NOTARY_KEY || '' }}
          MACOS_NOTARY_KEY_ID: ${{ inputs.mode == 'release' && secrets.MACOS_NOTARY_KEY_ID || '' }}
          MACOS_NOTARY_ISSUER_ID: ${{ inputs.mode == 'release' && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
        run: sh .github/scripts/check-macos-signing-env.sh "$GARAGE_RELEASE_MODE"
      - name: Build, sign and notarize macOS, archive, and checksum
        env:
          GORELEASER_CURRENT_TAG: ${{ needs.guard.outputs.tag }}
          MACOS_SIGN_P12: ${{ inputs.mode == 'release' && secrets.MACOS_SIGN_P12 || '' }}
          MACOS_SIGN_PASSWORD: ${{ inputs.mode == 'release' && secrets.MACOS_SIGN_PASSWORD || '' }}
          MACOS_NOTARY_KEY: ${{ inputs.mode == 'release' && secrets.MACOS_NOTARY_KEY || '' }}
          MACOS_NOTARY_KEY_ID: ${{ inputs.mode == 'release' && secrets.MACOS_NOTARY_KEY_ID || '' }}
          MACOS_NOTARY_ISSUER_ID: ${{ inputs.mode == 'release' && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
        run: goreleaser release --clean --skip=publish
      - name: Check the GoReleaser archives and executables
        run: |
          test -f "dist/garage_${VERSION}_checksums.txt"
          for f in $(sh .github/scripts/release-inventory.sh "$VERSION" archives); do test -f "dist/$f"; done
      - name: Run the linux/amd64 archive
        run: sh .github/scripts/check-release-archive.sh "dist/garage_${VERSION}_linux_amd64.tar.gz" "$TAG" "$(git rev-parse HEAD)"
      - name: Check the Homebrew cask (macOS and Linux)
        run: sh .github/scripts/check-channel-cask.sh dist/homebrew/Casks/garage.rb "dist/garage_${VERSION}_checksums.txt" "$VERSION" "$GITHUB_REPOSITORY"
      - name: Keep the Homebrew cask for channel-publish
        if: inputs.mode == 'release'
        # Not a release asset. Kept 30 days, the window in which a failed
        # channel-publish job can be re-run against this exact release (#124).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-cask
          path: dist/homebrew/Casks/garage.rb
          if-no-files-found: error
          retention-days: 30
      - name: Stage the archives and Linux packages for macOS packaging
        run: |
          mkdir "$RUNNER_TEMP/release-build"
          for f in $(sh .github/scripts/release-inventory.sh "$VERSION" archives) $(sh .github/scripts/release-inventory.sh "$VERSION" packages | grep -v '\.pkg$'); do
            cp "dist/$f" "$RUNNER_TEMP/release-build/"
          done
      - name: Hand unsigned final-artifact inputs to macOS packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build/
          if-no-files-found: error
          retention-days: 1

  macos-package:
    name: Package macOS ${{ matrix.arch }}
    needs: [guard, build]
    runs-on: ${{ matrix.runner }}
    environment: macos-signing
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: macos-15-intel }
          - { arch: arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: assets
      - name: Build, sign, notarize, and staple the installer
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ needs.guard.outputs.version }}
          ARCH: ${{ matrix.arch }}
          MACOS_INSTALLER_P12: ${{ inputs.mode == 'release' && secrets.MACOS_INSTALLER_P12 || '' }}
          MACOS_INSTALLER_PASSWORD: ${{ inputs.mode == 'release' && secrets.MACOS_INSTALLER_PASSWORD || '' }}
          MACOS_NOTARY_KEY: ${{ inputs.mode == 'release' && secrets.MACOS_NOTARY_KEY || '' }}
          MACOS_NOTARY_KEY_ID: ${{ inputs.mode == 'release' && secrets.MACOS_NOTARY_KEY_ID || '' }}
          MACOS_NOTARY_ISSUER_ID: ${{ inputs.mode == 'release' && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
        run: sh .github/scripts/build-macos-package.sh "$MODE" "$VERSION" "$ARCH" "assets/garage_${VERSION}_darwin_${ARCH}.tar.gz" "assets/garage_${VERSION}_darwin_${ARCH}.pkg"
      - name: Install and remove the package
        env:
          GARAGE_MACOS_PACKAGE_CHECK: 1
          MODE: ${{ inputs.mode }}
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ needs.guard.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: sh .github/scripts/check-macos-package.sh "$MODE" "assets/garage_${VERSION}_darwin_${ARCH}.pkg" "$VERSION" "$TAG" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-package-${{ matrix.arch }}
          path: assets/garage_${{ needs.guard.outputs.version }}_darwin_${{ matrix.arch }}.pkg
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble and validate final release inventory
    needs: [guard, build, macos-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-build
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-package-*
          path: assets
          merge-multiple: true
      - name: Make the final checksum manifest after every package exists
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          for f in $(sh .github/scripts/release-inventory.sh "$VERSION" manifest); do test -f "assets/$f"; done
          (cd assets && sha256sum $(sh ../.github/scripts/release-inventory.sh "$VERSION" manifest) >"garage_${VERSION}_checksums.txt")
      - name: Check the archives, packages, manifest, and executables
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: sh .github/scripts/check-release-dist.sh assets "$VERSION" "$TAG" "$GITHUB_SHA"
      - name: Hand the complete release inventory to release gates
        if: inputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: assets/
          if-no-files-found: error
          retention-days: 1

  run-check:
    name: Run ${{ matrix.target }}
    needs: [guard, assemble]
    if: inputs.mode == 'release'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux_amd64, ext: tar.gz, runner: ubuntu-latest }
          - { target: linux_arm64, ext: tar.gz, runner: ubuntu-24.04-arm }
          - { target: darwin_amd64, ext: tar.gz, runner: macos-15-intel }
          - { target: darwin_arm64, ext: tar.gz, runner: macos-latest }
          - { target: windows_amd64, ext: zip, runner: windows-latest }
          - { target: windows_arm64, ext: zip, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: assets
      - name: Check the macOS executable's signature and notarization
        if: startsWith(matrix.target, 'darwin_')
        env:
          ARCHIVE: assets/garage_${{ needs.guard.outputs.version }}_${{ matrix.target }}.${{ matrix.ext }}
        run: sh .github/scripts/check-macos-notarization.sh "$ARCHIVE" "$MACOS_TEAM_ID"
      - name: Run the archive
        shell: bash
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          ARCHIVE: assets/garage_${{ needs.guard.outputs.version }}_${{ matrix.target }}.${{ matrix.ext }}
        run: sh .github/scripts/check-release-archive.sh "$ARCHIVE" "$TAG" "$GITHUB_SHA"

  package-check:
    name: Install ${{ matrix.suffix }}
    needs: [guard, assemble]
    if: inputs.mode == 'release'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { suffix: linux_amd64.deb, runner: ubuntu-latest }
          - { suffix: linux_arm64.deb, runner: ubuntu-24.04-arm }
          - { suffix: x86_64.rpm, runner: ubuntu-latest }
          - { suffix: aarch64.rpm, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: assets
      - name: Install, check, and remove the package
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          pkg=$(sh .github/scripts/release-inventory.sh "$VERSION" packages | grep -F -- "$SUFFIX")
          case $pkg in
          *.deb)
            GARAGE_PACKAGE_CHECK=1 sh .github/scripts/check-release-package.sh "assets/$pkg" "$TAG" "$GITHUB_SHA"
            ;;
          *.rpm)
            docker run --rm -e GARAGE_PACKAGE_CHECK=1 -v "$PWD:/w:ro" -w /w "$FEDORA_IMAGE" \
              sh -c 'dnf install -y -q git >/dev/null && sh .github/scripts/check-release-package.sh "$1" "$2" "$3"' \
              sh "assets/$pkg" "$TAG" "$GITHUB_SHA"
            ;;
          *)
            echo "::error::no package in the release inventory ends with $SUFFIX"
            exit 1
            ;;
          esac

  sign:
    name: Sign the checksum manifest
    needs: [guard, run-check, package-check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      MANIFEST: garage_${{ needs.guard.outputs.version }}_checksums.txt
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: assets
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign with keyless cosign
        run: cosign sign-blob --yes --bundle "assets/$MANIFEST.sigstore.json" "assets/$MANIFEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: assets/${{ env.MANIFEST }}.sigstore.json
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest every archive
    needs: [guard, run-check, package-check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: assets
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: assets/garage_${{ needs.guard.outputs.version }}_checksums.txt

  verify:
    name: Verify before publishing
    needs: [guard, sign, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify the signature, checksums, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: sh .github/scripts/verify-release.sh assets "$TAG" "$GITHUB_REPOSITORY"

  publish:
    name: Publish the release
    needs: [guard, verify]
    runs-on: ubuntu-latest
    # Requires the Workflow Owner's approval; its deployment rule allows only
    # v* tags.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Create a draft release with exactly the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" "$GITHUB_REPOSITORY" >notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "garage $TAG" --notes-file notes.md assets/*
      - name: Check the draft's assets, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want=$(ls -1 assets | sort)
          got=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          if [ "$got" != "$want" ]; then
            echo "::error::the draft's assets differ from the verified assets"
            printf 'want:\n%s\ngot:\n%s\n' "$want" "$got"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  post-verify:
    name: Verify the published release
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Download and verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          sh .github/scripts/verify-release.sh published "$TAG" "$GITHUB_REPOSITORY"

  # Channels (#124). They run only after the immutable release passed
  # post-verify, which follows the Workflow Owner's release approval. A
  # channel failure does not affect the published release: re-run the failed
  # job, within 30 days, against the same release (the cask artifact is kept
  # 30 days).
  channel-publish:
    name: Publish the Homebrew cask
    needs: [guard, post-verify]
    runs-on: ubuntu-latest
    # Holds HOMEBREW_TAP_TOKEN: a fine-grained token for
    # bdonaldharris/homebrew-tap only, with no access to this repository.
    environment: channel-publish
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: channel-cask
          path: cask
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Check the cask against the published, verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          sh .github/scripts/verify-release.sh published "$TAG" "$GITHUB_REPOSITORY"
          sh .github/scripts/check-channel-cask.sh cask/garage.rb "published/garage_${VERSION}_checksums.txt" "$VERSION" "$GITHUB_REPOSITORY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bdonaldharris/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit the cask to the tap
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../cask/garage.rb Casks/garage.rb
          git add Casks/garage.rb
          if git diff --cached --quiet; then
            echo "The tap already has the cask for $TAG; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "garage $TAG" -m "Generated by GoReleaser from the verified release https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          git push -q origin HEAD

  channel-verify:
    name: Install the cask from the tap (${{ matrix.runner }})
    needs: [guard, channel-publish]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Set up Homebrew
        run: sh .github/scripts/setup-homebrew.sh
      - name: Install, check, and uninstall garage from the tap
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          if [ "$(uname -s)" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          GARAGE_PACKAGE_CHECK=1 sh .github/scripts/check-brew-cask.sh --tap bdonaldharris/tap "$TAG" "$GITHUB_SHA"
